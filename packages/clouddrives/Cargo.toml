[package]
name = "yggdrasil-clouddrives"
version = "0.1.0"
edition = "2021"
description = "Cloud drives: rclone remotes mounted as folders by a systemd user unit, and folders a sync app keeps; shared by Settings > Apps > Minos > Cloud drives and Minos's Cloud Storage"
license = "MPL-2.0"

[lib]
name = "yggdrasil_clouddrives"
path = "src/lib.rs"

[dependencies]
# where the list lives (~/.config/yggdrasil, the folder Minos and the panel already watch)
yggdrasil-conf = { path = "../yggdrasil-conf" }
# `rclone config dump` is JSON (already in the tree of Minos and Settings)
serde_json = "1.0.151"
