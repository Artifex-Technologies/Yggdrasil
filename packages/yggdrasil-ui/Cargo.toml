[package]
name = "yggdrasil-ui"
version = "0.1.0"
edition = "2021"
description = "The shared look of Yggdrasil's apps (Minos, Settings): palette, theme, title bar"
license = "MPL-2.0"

[lib]
name = "yggdrasil_ui"
path = "src/lib.rs"

[dependencies]
eframe = "0.36.2"
yggdrasil-conf = { path = "../yggdrasil-conf" }
# a finger's drag moves and resizes the window through the compositor (touchmove.rs)
yggdrasil-wm = { path = "../wm" }
# the privacy pack's switches file (privacy_prefs.rs)
serde_json = "1"
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
# dnd.rs: files dragged in from other programs and out to them on Wayland (winit has no drag and drop there); Minos and
# Settings > Appearance > Fonts. All already in the tree through winit
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
raw-window-handle = "0.6"
libc = "0.2"
