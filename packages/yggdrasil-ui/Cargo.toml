[package]
name = "yggdrasil-ui"
version = "0.1.0"
edition = "2021"
description = "The shared look of Yggdrasil's apps (Minos, Settings): palette, theme, title bar"
license = "MIT"

[lib]
name = "yggdrasil_ui"
path = "src/lib.rs"

[dependencies]
eframe = "0.36.2"
dirs = "7.0.0"
yggdrasil-conf = { path = "../yggdrasil-conf" }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
