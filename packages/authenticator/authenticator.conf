# Yggdrasil bar add-on: a key in the top bar; its card, drawn by the panel, searches the codes and copies one with a click
# (docs/INTEGRATIONS.md, bar-item and "Cards you can use")
kind = bar-item
name = Authenticator
command = /usr/bin/yggdrasil-authenticator --bar
interval = 0
icon = authenticator-symbolic
act = /usr/bin/yggdrasil-authenticator press
