# Yggdrasil top bar add-on: the timer's pill and card (see docs/INTEGRATIONS.md, bar-item and "Cards").
# yggdrasil-timer writes the file whenever a timer starts, stops or rings; the panel counts down by itself and runs `press` for the
# card's buttons.
kind = bar-item
name = Timer
file = %h/.local/state/yggdrasil/timer/bar.json
icon = /usr/share/yggdrasil/icons/timer-symbolic.svg
act = /usr/bin/yggdrasil-timer press
