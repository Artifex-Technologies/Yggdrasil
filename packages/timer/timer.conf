# Yggdrasil top bar add-on: the timer's pill (see docs/INTEGRATIONS.md, bar-item).
# yggdrasil-timer writes the file whenever a timer starts, stops or rings; the panel counts down by itself.
kind = bar-item
name = Timer
file = %h/.local/state/yggdrasil/timer/bar.json
icon = /usr/share/yggdrasil/icons/timer-symbolic.svg
open = /usr/bin/yggdrasil-timer
