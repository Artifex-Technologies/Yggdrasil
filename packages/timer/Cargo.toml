[package]
name = "yggdrasil-timer"
version = "0.1.0"
edition = "2021"
description = "Countdown timers in Yggdrasil's top bar: presets, several at once, an alarm that rings with the window closed"
license = "MIT"

[dependencies]
eframe = "0.36.2"
yggdrasil-ui = { path = "../yggdrasil-ui" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = true
strip = true
