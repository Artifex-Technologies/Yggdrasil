[package]
name = "yggdrasil-appusage"
version = "0.1.0"
edition = "2021"
description = "labyrinth-appusage: how long each app has been running, for Settings > Apps (sort by usage). Follows the user's systemd scopes in the cgroup tree with inotify instead of asking systemctl every 30 seconds."
license = "MPL-2.0"

[lib]
name = "labyrinth_appusage"
path = "src/lib.rs"

# the user service labyrinth-appusage.service runs it (installed as /usr/bin/labyrinth-appusage)
[[bin]]
name = "labyrinth-appusage"
path = "src/main.rs"

# the parity runs (parity/compare.py): the service's counting fed from a file of steps instead of the cgroup tree
[[example]]
name = "appusage_replay"
path = "examples/appusage_replay.rs"

[dependencies]
libc = "0.2"
yggdrasil-pycompat = { path = "../pycompat" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
serde_json = "1"
