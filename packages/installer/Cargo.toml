[package]
name = "yggdrasil-installer"
version = "0.1.0"
edition = "2021"
description = "Installs the operating system from its live medium: Yggdrasil's window, the OS's own install steps"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-installer"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
# the computer's devices and the OS's device list, read as the installed system reads them later (packages/device-offers)
yggdrasil-device-offers = { path = "../device-offers" }
# the live session's keyboard layout while one is chosen (Hyprland or Yggdrasil's own compositor)
yggdrasil-wm = { path = "../wm" }
yggdrasil-ui = { path = "../yggdrasil-ui" }
# the time zone page: the map and the short list, shared with Settings
yggdrasil-tzpicker = { path = "../tzpicker" }
eframe = "0.36.2"
serde_json = "1.0.151"

[profile.release]
opt-level = "s"
lto = true
strip = true
