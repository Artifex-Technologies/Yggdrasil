[package]
name = "yggdrasil-spell"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's spelling library: the installed Hunspell dictionaries, the languages you use, and one word list shared by your apps"
license = "MPL-2.0"

[lib]
name = "yggdrasil_spell"
path = "src/lib.rs"

[[bin]]
name = "yggdrasil-spell"
path = "src/main.rs"

[dependencies]
spellbook = "0.4.2"
yggdrasil-conf = { path = "../yggdrasil-conf" }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
