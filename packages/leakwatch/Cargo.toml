[package]
name = "yggdrasil-leakwatch"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's leak watch: every few minutes it notes how much memory each program uses, and how much memory each program has handed to the compositor (its images), and warns when one keeps growing for hours. Runs from a timer and exits: nothing stays in memory."
license = "MPL-2.0"

[lib]
path = "src/lib.rs"

[[bin]]
name = "yggdrasil-leakwatch"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
