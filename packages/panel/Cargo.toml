[package]
name = "yggdrasil-panel"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's top bar and dock (Wayland layer-shell, software-rendered, tiny)"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-panel"
path = "src/main.rs"

# the small commands for key bindings and the panel (installed in /usr/bin): the panel's remote, the multimedia keys, and
# opening a drive just connected
[[bin]]
name = "yggdrasil-panelctl"
path = "src/bin/yggdrasil-panelctl.rs"

[[bin]]
name = "yggdrasil-mediakey"
path = "src/bin/yggdrasil-mediakey.rs"

[[bin]]
name = "yggdrasil-mount-open"
path = "src/bin/yggdrasil-mount-open.rs"

[dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs", "shm", "event", "time"] }
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
ab_glyph = "0.2"
libc = "0.2"
serde_json = "1"
xkbcommon = "0.8"
zbus = "5"
accesskit = "0.25"
accesskit_unix = "0.24"
yggdrasil-conf = { path = "../yggdrasil-conf" }
# the compositor (Hyprland or Yggdrasil's own): desktops, zones, the dock's minimize, the pointer
yggdrasil-wm = { path = "../wm" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
