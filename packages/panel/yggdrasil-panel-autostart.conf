# The panel's unit is made by systemd from the autostart entry (/etc/xdg/autostart/yggdrasil-panel.desktop) as
# app-yggdrasil\x2dpanel@autostart.service; installed as a drop-in for it in /usr/lib/systemd/user/app-yggdrasil\x2dpanel@autostart.service.d/.
[Service]
# The panel's end is the unit's end. The generator's ExitType=cgroup counted any process left in the unit as the panel still
# running: on 2026-11-13 the panel ended with Hyprland's display (exit 0) while its `pactl subscribe` lived on, and the unit
# stayed "active (running)" with no panel, so the session's start after Hyprland restarted did not start it again. Whatever
# is left in the unit when the panel ends is ended with it.
ExitType=main
# A crash of the panel alone (Hyprland still running) brings it back. Its quiet end when the display goes (exit 0) does not:
# yggdrasil-session starts the session's programs again once the next Hyprland is up.
Restart=on-failure
RestartSec=1
