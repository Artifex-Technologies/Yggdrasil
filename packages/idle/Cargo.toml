[package]
name = "yggdrasil-idle"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's idle manager: watches how long the user has been away (Wayland ext-idle-notify) and, when told to, dims, locks, turns the display off or sleeps. Starts in observe-only mode."
license = "MIT"

[[bin]]
name = "yggdrasil-idle"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
