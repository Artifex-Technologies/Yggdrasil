[package]
name = "yggdrasil-colorpicker"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's Color Picker: pick a colour anywhere on the screen (a frozen picture with a loupe), copy it in the chosen format"
license = "MPL-2.0"

[lib]
name = "colorpicker"
path = "src/lib.rs"

[[bin]]
name = "yggdrasil-colorpicker"
path = "src/main.rs"
required-features = ["picker"]

[features]
default = ["picker"]
# The picker itself (Wayland, drawing). Settings uses the library without it: formats, history, the chosen format.
picker = ["dep:wayland-client", "dep:wayland-protocols", "dep:wayland-protocols-wlr", "dep:memmap2", "dep:rustix", "dep:tiny-skia", "dep:ab_glyph", "dep:yggdrasil-conf"]

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"], optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
memmap2 = { version = "0.9", optional = true }
rustix = { version = "1", features = ["fs", "shm"], optional = true }
tiny-skia = { version = "0.11", optional = true }
ab_glyph = { version = "0.2", optional = true }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
