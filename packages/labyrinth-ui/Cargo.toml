[package]
name = "labyrinth-ui"
version = "0.1.0"
edition = "2021"
description = "The shared look of Labyrinth's own apps (Minos, Settings): palette, theme, title bar"
license = "MIT"

[lib]
name = "labyrinth_ui"
path = "src/lib.rs"

[dependencies]
eframe = "0.36.2"
dirs = "7.0.0"
resvg = { version = "0.48", default-features = false, features = ["raster-images"] }
