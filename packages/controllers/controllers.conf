# Yggdrasil bar add-on: game controllers' battery in the top bar, and a card with a rumble test, light bar colours and disconnect
# (docs/INTEGRATIONS.md, bar-item). yggdrasil-controllers daemon writes the file; nothing shows while no controller is connected.
kind = bar-item
name = Controllers
file = %h/.local/state/yggdrasil/controllers/bar.json
icon = input-gaming-symbolic
act = /usr/bin/yggdrasil-controllers press
