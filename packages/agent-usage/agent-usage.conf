# A Yggdrasil bar add-on (docs/INTEGRATIONS.md, kind bar-item): Claude's weekly and 5-hour limits in the top bar, red when the
# week's use is ahead of an even pace. Installed by the yggdrasil-agent-usage package; removing the package removes the pill.
kind = bar-item
name = Agent usage
command = /usr/bin/yggdrasil-agent-usage --bar
interval = 300
