# A Yggdrasil bar add-on (docs/INTEGRATIONS.md, kind bar-item): every AI agent on this computer in one item. The pill is the
# number of agents running and a ring for the busiest limit; the card lists each agent (Claude Code's sessions, Sarina, other
# agents' usage records) with its state, usage, reset time and last activity. Read-only: starting an agent stays in a terminal.
# Installed by the yggdrasil-agent-usage package; it can be hidden in Settings > Appearance > Top bar and dock.
kind = bar-item
name = Agents
command = /usr/bin/yggdrasil-agent-usage --agents
# every ten minutes at most when nothing changes; a change in these folders runs it again (at most once a minute):
# Claude Code's session notes, other agents' usage records, the Agent usage reading, Sarina's sessions
interval = 600
watch = %h/.claude/sessions %h/.local/state/omarchy/agents/usage %h/.cache/yggdrasil/agent-usage /var/lib/sarina/sessions
act = /usr/bin/yggdrasil-agent-usage --act
