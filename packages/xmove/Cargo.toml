[package]
name = "yggdrasil-xmove"
version = "0.1.0"
edition = "2021"
description = "Lets X11 programs that draw their own title bar (Steam) be dragged and resized in Hyprland"
license = "MPL-2.0"

[dependencies]
x11rb = "0.13.2"
# Hyprland's socket, found and bounded the same way as every other tool's
yggdrasil-wm = { path = "../wm" }

[profile.release]
opt-level = "s"
lto = true
strip = true
