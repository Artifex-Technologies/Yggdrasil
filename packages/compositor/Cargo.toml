[package]
name = "yggdrasil-compositor"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's own Wayland compositor (Smithay), in development: the session runs on Hyprland meanwhile. Runs nested in a window, headless for tests, or on the hardware (DRM/KMS) from a text console while it is built."
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-compositor"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
# input.rs: Settings > Peripherals' input.conf, read with the parser Settings writes it with (the layer Yggdrasil's tools share)
yggdrasil-wm = { path = "../wm" }
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_egl", "backend_drm", "backend_gbm", "backend_udev", "backend_libinput", "backend_session_libseat", "renderer_gl", "renderer_pixman", "desktop", "wayland_frontend", "use_system_lib", "xwayland"] }
tiny-skia = "0.12"
# x11asked.rs and xwayland.rs: X11 properties read and written on connections of their own (the active window and the input
# focus, programs' own icons, WM_STATE, XWayland's X resources); the 0.14 Smithay main and winit use, one copy in the build
x11rb = "0.14"
ab_glyph = "0.2"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# headless.rs: an output's picture written as a PNG (screenshots for tests); already in the tree
png = "0.17"
# udev.rs: the signals that end the hardware backend, taken through a signalfd; already in the tree
libc = "0.2"
# configs.rs: the config files' folders watched with inotify (rustix's safe calls); already in the tree through calloop
rustix = { version = "1", features = ["fs"] }
# pointer.rs: the cursor theme's pictures (libXcursor's lookup and file format, in Rust); already in the tree through smithay
xcursor = "0.3"
# ctm.rs: hyprland-ctm-control-v1 (protocols/, BSD-3-Clause, from hyprland-protocols), the protocol hyprsunset speaks, made into
# code at build time; the three are already in the tree through smithay
wayland-scanner = "0.31"
wayland-backend = "0.3"
wayland-server = "0.31"
# icons.rs: the apps' icons on the window switcher's cards (SVG, as the panel draws them; no text or raster support needed)
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
# tests/: a small Wayland client of the tests' own (tests/common) that speaks to the headless backend like the panel, a window,
# the lock screen, a screenshot tool and the idle manager do; and Yggdrasil's own programs started inside it (tests/apps.rs)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 2
lto = "thin"

# Smithay's main branch (46643d20, merged in by 8ff04271; its version is still 0.7.0, so it stands in for the 0.7 above) with
# eighteen commits of ours:
# our fork, github.com/Artifex-Technologies/smithay-yggdrasil, branch yggdrasil/smithay-main, pinned by commit (8ff04271).
#   514b9ae1  the X11 sockets bound apart from starting XWayland (X11Sockets, XWayland::spawn_with_sockets), so XWayland
#             starts on the first X11 program (xwayland.rs)
#   3c8ca3a4  two X11 window manager fixes: every event was dropped after set_randr_primary_output until the next request;
#             close left a client that cannot be asked running without its window, and now ends it with XKillClient
#   0b9ef80c  a layer surface's set_size clamped at i32::MAX (a program's huge size ended a debug build: a negative size)
#   77d67ca1  _GTK_FRAME_EXTENTS clamped at 0..=u16::MAX (a program's huge values ended a debug build: an overflow in
#             X11Surface::geometry)
#   be625ae9  three XDND fixes: only a drag started on XWayland's surfaces can become an X11 drag, a vanished drop target
#             ends the drag, a drag the X11 program gave up ends with the grab
#   9107c377  the window manager's clipboard, primary-selection and XdndSelection transfers, and a drop not finished yet,
#             end when XWayland's X connection closes (before, such a transfer's pipe becoming ready ended the compositor)
#   5bb77de9  rustfmt only
#   2cdd308a  a drop on an X11 window that its target has not finished (XdndFinished) 10 s after it is cancelled (before,
#             a hung target left the dragging program waiting and stopped every X11 drag)
#   cef101c1  a finger drag's lift passed on to XWayland for an X11 program's drag (before, it never dropped, and XWayland
#             kept the finger and the left button down)
#   7773aa92  a Wayland program's drag's data given to X11 programs only from a drop the X11 window accepted until the drop
#             ends (before, any X11 program could read it while the drag was over any X11 window)
#   4767697a  a drop an X11 target says it did not take (XDND 5's XdndFinished, accept bit clear) is cancelled for the
#             dragging program (before, it was told finished, and a move deleted data that arrived nowhere)
#   0949074e  a drag leaving an X11 window clears only its own offer (before, with a mouse and a finger drag at once, it
#             cleared the other's waiting drop, which then never ended and its program never heard back)
#   84cf834d  the window manager takes WM_S0 after its setup (before, an X11 program waiting for XWayland on demand could map
#             a window before the root's subwindows were redirected under load, and that window never showed)
#   92c735b4  the drop proxy of an X11 program's drag unmapped when the grab ends (before, it stayed over every X11 window
#             until the Wayland target let go of its offer, and took their presses unless the compositor's raise came first)
#   2f436c2f  a touch cancel in a frame of its own sent to the clients (wl_touch.cancel), and a finger drag's cancel passed on
#             to the dragging client (before, nobody was told, and XWayland kept an X11 program's finger down)
#   ad803e0f  a window that starts Iconic (WM_HINTS) has _NET_WM_STATE_HIDDEN in its property from the map (before, only in
#             Smithay's own copy of the state, so a later set_hidden(true) wrote nothing)
#   744c9e21  an X11 drag its program gave up (XdndLeave, the button still held) is not dropped on the Wayland window under
#             the pointer: that window is told only that the drag left, and its offer gives nothing (before, it was told "drop")
#   e99c58d8  libseat's PauseSession handler runs before the seat is disabled, as wlroots does (before, the seat was let go
#             first, and under seatd the GPU then refused to take Night Light's tint off on a switch made from elsewhere)
[patch.crates-io]
smithay = { git = "https://github.com/Artifex-Technologies/smithay-yggdrasil", rev = "8ff0427178aca317ff26da151ec49e9dbb1dc569" }
