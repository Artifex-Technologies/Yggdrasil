[package]
name = "yggdrasil-compositor"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's own Wayland compositor (Smithay), in development: the session runs on Hyprland meanwhile. Runs nested in a window while it is built."
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-compositor"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_egl", "renderer_gl", "desktop", "wayland_frontend", "use_system_lib"] }
tracing = "0.1"
tiny-skia = "0.11"
ab_glyph = "0.2"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 2
lto = "thin"
