[package]
name = "yggdrasil-compositor"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's own Wayland compositor (Smithay), in development: the session runs on Hyprland meanwhile. Runs nested in a window, headless for tests, or on the hardware (DRM/KMS) from a text console while it is built."
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-compositor"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
# input.rs: Settings > Peripherals' input.conf, read with the parser Settings writes it with (the layer Yggdrasil's tools share)
yggdrasil-wm = { path = "../wm" }
smithay = { version = "0.7", default-features = false, features = ["backend_winit", "backend_egl", "backend_drm", "backend_gbm", "backend_udev", "backend_libinput", "backend_session_libseat", "renderer_gl", "renderer_pixman", "desktop", "wayland_frontend", "use_system_lib", "xwayland"] }
tiny-skia = "0.12"
# x11asked.rs: one property read on its own connection (already in the tree through smithay)
x11rb = "0.13"
ab_glyph = "0.2"
wayland-protocols-wlr = { version = "0.3", features = ["server"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# headless.rs: an output's picture written as a PNG (screenshots for tests); already in the tree
png = "0.17"
# udev.rs: the signals that end the hardware backend, taken through a signalfd; already in the tree
libc = "0.2"
# pointer.rs: the cursor theme's pictures (libXcursor's lookup and file format, in Rust); already in the tree through smithay
xcursor = "0.3"
# ctm.rs: hyprland-ctm-control-v1 (protocols/, BSD-3-Clause, from hyprland-protocols), the protocol hyprsunset speaks, made into
# code at build time; the three are already in the tree through smithay
wayland-scanner = "0.31"
wayland-backend = "0.3"
wayland-server = "0.31"
# icons.rs: the apps' icons on the window switcher's cards (SVG, as the panel draws them; no text or raster support needed)
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
# tests/: a small Wayland client of the tests' own (tests/common) that speaks to the headless backend like the panel, a window,
# the lock screen, a screenshot tool and the idle manager do; and Yggdrasil's own programs started inside it (tests/apps.rs)
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

[profile.release]
opt-level = 2
lto = "thin"
