[package]
name = "yggdrasil-portal"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's xdg-desktop-portal backend: Minos as the open/save dialog for every application"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-portal"
path = "src/main.rs"

[dependencies]
zbus = "5"
libc = "0.2"
yggdrasil-conf = { path = "../yggdrasil-conf" }
# the window in front, when a program does not say who it is (Hyprland or Yggdrasil's own compositor)
yggdrasil-wm = { path = "../wm" }
blocking = "1"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
