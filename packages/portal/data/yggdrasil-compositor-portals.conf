# Which portal backend answers which request in the Yggdrasil session on its own compositor
# (XDG_CURRENT_DESKTOP=Yggdrasil-Compositor:Yggdrasil; the session on Hyprland uses yggdrasil-portals.conf).
# As on Hyprland, but screen sharing, screenshots and picked colours are Yggdrasil's own (yggdrasil-portal's ScreenCast: the
# share picker, then yggdrasil-screencast per screen; its Screenshot: grim, yggdrasil-shot, yggdrasil-colorpicker), and
# Hyprland's portal is not used: global shortcuts through the portal have no backend here. Passwords: gnome-keyring. The rest:
# the GTK backend.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=yggdrasil
org.freedesktop.impl.portal.Settings=yggdrasil;gtk
org.freedesktop.impl.portal.ScreenCast=yggdrasil
org.freedesktop.impl.portal.Screenshot=yggdrasil
org.freedesktop.impl.portal.GlobalShortcuts=none
org.freedesktop.impl.portal.Secret=gnome-keyring
