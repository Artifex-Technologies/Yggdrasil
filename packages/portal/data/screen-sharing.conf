# The bar's screen sharing item (docs/INTEGRATIONS.md, bar-item): a red "Sharing" pill while a program shares a screen on
# Yggdrasil's own compositor (yggdrasil-portal writes the file whenever that changes); its card names each program and the
# screens it sees, and Stop sharing ends every share at once.
kind = bar-item
name = Screen sharing
file = %h/.local/state/yggdrasil/screen-sharing.json
act = /usr/bin/yggdrasil-portal --stop-sharing
