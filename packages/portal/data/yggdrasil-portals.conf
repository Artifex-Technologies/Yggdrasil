# Which portal backend answers which request when the session is Yggdrasil (XDG_CURRENT_DESKTOP=Yggdrasil).
# Open and save dialogs: Yggdrasil's (Minos). The rest: until Yggdrasil's portal covers them, the GTK backend.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=yggdrasil
org.freedesktop.impl.portal.Settings=yggdrasil;gtk
