# Which portal backend answers which request when the session is Yggdrasil (XDG_CURRENT_DESKTOP=Yggdrasil).
# Open and save dialogs, dark or light and the accent: Yggdrasil's. Screenshots, screen sharing and global shortcuts: the compositor's
# own (Hyprland's). Passwords: gnome-keyring. The rest: the GTK backend.
[preferred]
default=gtk
org.freedesktop.impl.portal.FileChooser=yggdrasil
org.freedesktop.impl.portal.Settings=yggdrasil;gtk
org.freedesktop.impl.portal.ScreenCast=hyprland
org.freedesktop.impl.portal.Screenshot=hyprland
org.freedesktop.impl.portal.GlobalShortcuts=hyprland
org.freedesktop.impl.portal.Secret=gnome-keyring
