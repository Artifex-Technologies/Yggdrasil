[package]
name = "yggdrasil-2048"
version = "0.1.0"
edition = "2021"
description = "2048: slide and merge tiles; Classic, Fibonacci, Evil and Daily, boards from 3x3 to 6x6"
license = "MIT"

[[bin]]
name = "yggdrasil-2048"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
eframe = "0.36.2"
yggdrasil-ui = { path = "../yggdrasil-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
