# Yggdrasil game time: ClamAV's signatures come from this timer instead of the freshclam daemon, which cannot wait for a
# game. Every 2 hours, as often as the daemon checks by default (freshclam.conf "Checks 12"), up to 10 minutes apart from
# other computers; a run missed while the computer was off comes soon after it starts (Persistent=true, the timer's own).
# clamav-freshclam-once.service waits while a game runs (its own drop-in). ClamAV's settings in /etc/clamav are not touched.
[Unit]
Description=ClamAV virus database update every 2 hours (waits for games)

[Timer]
OnCalendar=
OnCalendar=*-*-* 00/2:00:00
AccuracySec=1min
RandomizedDelaySec=10min
