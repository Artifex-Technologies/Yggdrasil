# Yggdrasil game time: this chore waits while a game runs and catches up within 5 minutes of the game ending
# (yggdrasil-gametime, docs/GAME_TIME.md). "+" runs the check outside the unit's sandbox: it has to see every process
# (ProtectProc=, User=) and note the unit in /run (ProtectSystem=strict makes /run read-only for the unit itself).
[Service]
ExecCondition=+/usr/bin/yggdrasil-gametime no-game %n
