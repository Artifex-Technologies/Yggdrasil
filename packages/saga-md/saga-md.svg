<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Saga MD: Saga, who keeps the stories, and her raven holding a scroll in its claws; the Markdown mark (M and arrow) on it.
       Huginn's raven flies, white on purple; this one perches, black, the scroll in its talons. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#efeaf6"/>
      <stop offset="1" stop-color="#d3cbe3"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf3df"/>
      <stop offset="1" stop-color="#ead8b0"/>
    </linearGradient>
    <linearGradient id="roll" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9ab73"/>
      <stop offset="0.45" stop-color="#f1e2bf"/>
      <stop offset="1" stop-color="#b8975c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)" stroke="#b3a8cc" stroke-width="1.5"/>
  <!-- the scroll: the open sheet between its two rolls -->
  <path fill="url(#paper)" stroke="#8b6b3d" stroke-width="1.4" d="M24 87 Q64 83 104 87 L104 109 Q64 105 24 109 Z"/>
  <rect x="14" y="83" width="13" height="30" rx="6.5" fill="url(#roll)" stroke="#8b6b3d" stroke-width="1.4"/>
  <rect x="101" y="83" width="13" height="30" rx="6.5" fill="url(#roll)" stroke="#8b6b3d" stroke-width="1.4"/>
  <ellipse cx="20.5" cy="86.5" rx="4.2" ry="1.8" fill="#8b6b3d" opacity="0.55"/>
  <ellipse cx="107.5" cy="86.5" rx="4.2" ry="1.8" fill="#8b6b3d" opacity="0.55"/>
  <!-- the Markdown mark on the sheet: M at the left, the arrow at the right, the raven's feet between them -->
  <path fill="none" stroke="#7c54d6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M35 102 L35 92 L42 98 L49 92 L49 102"/>
  <path fill="none" stroke="#7c54d6" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" d="M88 91 L88 102 M82.5 96.5 L88 102 L93.5 96.5"/>
  <!-- the raven, perched on the scroll, facing right: a long heavy beak, the shaggy throat of a raven -->
  <path fill="#1b1722" d="M105 38 C98 34 90 30 82 28 C79 23 73 20 67 21 C59 22 54 29 54 37 C54 42 55 45 56 48
        C48 54 42 62 38 68 L20 80 L27 85 L42 78 C48 80 53 82 58 82 L59 86 L64 86 L65 83 L68 83 L69 86 L74 86 L73 82
        C77 78 79 70 80 63 L84 59 L80 56 L85 52 L81 49 L86 45 C91 43 99 41 105 39 Z"/>
  <!-- the wing, a shade lighter so the bird has a shape -->
  <path fill="#3d3549" d="M57 47 C50 54 45 62 42 71 C50 73 58 71 64 65 C68 60 69 53 67 47 C64 45 60 45 57 47 Z"/>
  <!-- the talons, curled over the scroll's edge -->
  <path fill="none" stroke="#1b1722" stroke-width="2.4" stroke-linecap="round"
        d="M59 85 q-1 4 -4 6 M62 85 q0 5 -2 8 M65 85 q1 4 0 6 M69 85 q-1 4 -3 6 M72 85 q0 5 -2 8 M75 85 q1 4 0 6"/>
  <!-- the eye -->
  <circle cx="74" cy="29" r="2.3" fill="#efeaf6"/>
</svg>
