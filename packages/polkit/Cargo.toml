[package]
name = "yggdrasil-polkit"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's polkit authentication agent: the password box that appears when something asks for administrator rights (pkexec, Settings)"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-polkit"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
zbus = "5"
libc = "0.2"
zeroize = "1"
serde_json = "1"
# already in zbus's tree: runs the password exchange on its own thread so a cancel from polkit is heard meanwhile
blocking = "1"
yggdrasil-ui = { path = "../yggdrasil-ui" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
