# Yggdrasil panel bar add-on: the temperature and rain in the next two hours.
# Installed to /usr/share/yggdrasil/integrations/weather.conf.
kind = bar-item
name = Weather
command = /usr/bin/yggdrasil-weather panel
interval = 600
icon = weather-few-clouds-symbolic
# the card's buttons (place, units) run: yggdrasil-weather press ID [TEXT]
act = /usr/bin/yggdrasil-weather press
