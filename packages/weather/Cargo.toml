[package]
name = "yggdrasil-weather"
version = "0.1.0"
edition = "2021"
description = "Multi-model weather consensus with measured-accuracy weighting, for the Yggdrasil bar"
license = "MIT"

[lib]
name = "yggdrasil_weather"
path = "src/lib.rs"

[[bin]]
name = "yggdrasil-weather"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = "3"
