[package]
name = "yggdrasil-settings"
version = "0.1.0"
edition = "2021"
description = "Settings: the everyday settings in one clean app (GNOME-style), for Yggdrasil"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-settings"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["file", "image", "svg"] }
# never called directly: egui_extras' "image" loader decodes only the formats switched on here (app icons, pictures)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
yggdrasil-ui = { path = "../yggdrasil-ui" }
yggdrasil-conf = { path = "../yggdrasil-conf" }
# the compositor (Hyprland or Yggdrasil's own): screens, reload, shortcuts, focusing a window
yggdrasil-wm = { path = "../wm" }
# Keyboard > Spelling and languages
yggdrasil-spell = { path = "../spell" }
yggdrasil-gamepads = { path = "../gamepads" }
# the Color Picker's formats and history (its library only, no picker)
yggdrasil-colorpicker = { path = "../colorpicker", default-features = false }
# Battery: which app a systemd scope belongs to, as the launcher's usage counter matches them (its library only)
yggdrasil-appusage = { path = "../appusage" }
# Battery and the wallpaper preview: days and the clock in the computer's time zone (in the tree through yggdrasil-tzpicker)
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo"] }
# Wi-Fi & Network: what nearby networks broadcast (the kernel's scan list, read without root or sending anything)
yggdrasil-wifiscan = { path = "../wifiscan" }
# joining a Wi-Fi network (the password goes to NetworkManager over D-Bus, never on a command line) and nmcli's Wi-Fi list
# and adapters: shared with the installer's Network step
yggdrasil-netjoin = { path = "../netjoin" }
# Bluetooth, the battery, Razer devices and VPNs over D-Bus (already in the tree: eframe's accessibility uses it)
zbus = "5"
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
# Date & time's map and short list of time zones (shared with the installer)
yggdrasil-tzpicker = { path = "../tzpicker" }

[dev-dependencies]
# the Razer tests talk to a made-up daemon over a socket pair (peer to peer: no bus)
zbus = { version = "5", features = ["p2p"] }
