[package]
name = "yggdrasil-settings"
version = "0.1.0"
edition = "2021"
description = "Settings: the everyday settings in one clean app (GNOME-style), on top of Plasma"
license = "MIT"

[[bin]]
name = "yggdrasil-settings"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["file", "image", "svg"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
yggdrasil-ui = { path = "../yggdrasil-ui" }
yggdrasil-conf = { path = "../yggdrasil-conf" }
yggdrasil-gamepads = { path = "../gamepads" }
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }
