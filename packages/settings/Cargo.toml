[package]
name = "yggdrasil-settings"
version = "0.1.0"
edition = "2021"
description = "Settings: the everyday settings in one clean app (GNOME-style), for Yggdrasil"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-settings"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["file", "image", "svg"] }
# never called directly: egui_extras' "image" loader decodes only the formats switched on here (app icons, pictures)
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
yggdrasil-ui = { path = "../yggdrasil-ui" }
yggdrasil-conf = { path = "../yggdrasil-conf" }
# the compositor (Hyprland or Yggdrasil's own): screens, reload, shortcuts, focusing a window
yggdrasil-wm = { path = "../wm" }
# Keyboard > Spelling and languages
yggdrasil-spell = { path = "../spell" }
yggdrasil-gamepads = { path = "../gamepads" }
# the Color Picker's formats and history (its library only, no picker)
yggdrasil-colorpicker = { path = "../colorpicker", default-features = false }
# Wi-Fi & Network: what nearby networks broadcast (the kernel's scan list, read without root or sending anything)
yggdrasil-wifiscan = { path = "../wifiscan" }
# joining a Wi-Fi network: the password goes to NetworkManager over D-Bus, never on a command line (already in the tree:
# eframe's accessibility uses it)
zbus = "5"
serde_json = "1.0.151"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# the Wi-Fi tests talk to a made-up NetworkManager over a socket pair (peer to peer: no bus)
zbus = { version = "5", features = ["p2p"] }
