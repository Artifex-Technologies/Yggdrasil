# Yggdrasil panel bar add-on: a laptop's battery, beside the clock (the panel puts this one there), and its drop-down with
# the power mode and the charge limit. Installed to /usr/share/yggdrasil/integrations/yggdrasil-battery.conf.
# `battery watch` (autostart) writes the file within seconds of a change; on a computer with no battery it says "off".
kind = bar-item
name = Battery
file = %h/.local/state/yggdrasil/battery/bar.json
icon = battery-good-symbolic
act = /usr/lib/yggdrasil/battery press
settings = /usr/bin/yggdrasil-settings power
