[package]
name = "yggdrasil-calculator"
version = "0.1.0"
edition = "2021"
description = "Calculator: standard with history, scientific when widened"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-calculator"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
eframe = "0.36.2"
yggdrasil-ui = { path = "../yggdrasil-ui" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
dirs = "7.0.0"
