[package]
name = "yggdrasil-browser-warm"
version = "0.1.0"
edition = "2021"
description = "Keeps the default Chromium-based browser running with no windows, so new windows and links open almost at once"
license = "MIT"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
