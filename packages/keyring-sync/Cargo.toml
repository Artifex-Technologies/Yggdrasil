[package]
name = "yggdrasil-keyring-sync"
version = "0.1.0"
edition = "2021"
description = "Keeps gnome-keyring's login keyring and the login password together: one clear question when they have drifted apart"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-keyring-sync"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
zbus = "5"
libc = "0.2"
zeroize = "1"
yggdrasil-ui = { path = "../yggdrasil-ui" }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
