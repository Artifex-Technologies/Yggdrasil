<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Yggdrasil's default system font (yggdrasil-theme). A font chosen in the installer or in Settings > Appearance > Fonts
     (56-yggdrasil-font.conf, yours or the computer's) is read first and wins; this one wins over the distribution's defaults
     (60-latin.conf). The families are the first of yggdrasil-conf's lists (packages/yggdrasil-conf/src/fonts.rs). -->
<fontconfig>
  <description>Yggdrasil: the default system font</description>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Atkinson Hyperlegible</family></prefer>
  </alias>
  <alias binding="same">
    <family>sans</family>
    <prefer><family>Atkinson Hyperlegible</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Atkinson Hyperlegible</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Atkinson Hyperlegible Mono</family></prefer>
  </alias>
</fontconfig>
