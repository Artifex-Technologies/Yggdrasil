# Huginn: Yggdrasil's video app (search, subscriptions without an account, playback in yggdrasil-player, downloads).
# core: everything that is not the window (no UI, no desktop-only code), so the iOS app can use it too; app: the desktop window.
[workspace]
members = ["core", "app"]
resolver = "2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
