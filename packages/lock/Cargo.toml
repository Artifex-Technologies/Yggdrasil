[package]
name = "yggdrasil-lock"
version = "0.1.0"
edition = "2021"
description = "Yggdrasil's screen locker (Wayland ext-session-lock-v1 + PAM)"
license = "MIT"

[[bin]]
name = "yggdrasil-lock"
path = "src/main.rs"

[[bin]]
name = "yggdrasil-greeter"
path = "src/greeter.rs"

[features]
# A stand-in password check for tests inside a throw-away compositor. NEVER enabled in a release build.
test-auth = []

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
calloop = "0.14"
calloop-wayland-source = "0.4"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs", "shm"] }
tiny-skia = "0.11"
ab_glyph = "0.2"
libc = "0.2"
xkbcommon = "0.8"
zeroize = "1"
serde_json = "1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
