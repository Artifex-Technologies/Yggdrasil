[package]
name = "agora"
version = "0.1.0"
edition = "2021"
description = "Agora: one place for apps, from Labyrinth's own catalog and from repositories you add"
license = "MIT"

[[bin]]
name = "agora"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["file", "image", "svg"] }
yggdrasil-ui = { path = "../yggdrasil-ui" }
roxmltree = "0.21.1"
serde_json = "1.0.151"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
