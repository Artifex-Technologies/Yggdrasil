[package]
name = "labyrinth-market"
version = "0.1.0"
edition = "2021"
description = "Labyrinth Marketplace: one place for apps, from Labyrinth's own catalog and from repositories you add"
license = "MIT"

[[bin]]
name = "labyrinth-market"
path = "src/main.rs"

[dependencies]
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["file", "image", "svg"] }
labyrinth-ui = { path = "../labyrinth-ui" }
serde_json = "1.0.151"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
