# Health reminders in Yggdrasil's top bar: the time to the next break; a click opens its card (the next reminder, which ones are on,
# their intervals and times, quiet hours, sound and pause), whose controls run `yggdrasil-health press ID`.
kind = bar-item
name = Health
file = %h/.local/state/yggdrasil/health/bar.json
icon = /usr/share/yggdrasil/icons/health-symbolic.svg
act = /usr/bin/yggdrasil-health press
