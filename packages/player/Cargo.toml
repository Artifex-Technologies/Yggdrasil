[package]
name = "yggdrasil-player"
version = "0.1.0"
edition = "2021"
description = "VLC in Yggdrasil's look: libVLC plays, Yggdrasil's window"
license = "MPL-2.0"

[[bin]]
name = "yggdrasil-player"
path = "src/main.rs"

[dependencies]
yggdrasil-conf = { path = "../yggdrasil-conf" }
yggdrasil-ui = { path = "../yggdrasil-ui" }
eframe = "0.36.2"
zbus = "5"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
