[package]
name = "yggdrasil-player"
version = "0.1.0"
edition = "2021"
description = "VLC in Yggdrasil's look: libVLC plays, Yggdrasil's window"
license = "MPL-2.0"

[lib]
name = "yggdrasil_player"
path = "src/lib.rs"

[[bin]]
name = "yggdrasil-player"
path = "src/main.rs"
required-features = ["app"]

# the window needs these; the library (src/vlc.rs, for Huginn) needs none of them
[features]
default = ["app"]
app = ["dep:yggdrasil-ui", "dep:eframe", "dep:zbus"]

[dependencies]
yggdrasil-ui = { path = "../yggdrasil-ui", optional = true }
eframe = { version = "0.36.2", optional = true }
zbus = { version = "5", optional = true }

[profile.release]
opt-level = 2
lto = "thin"
strip = true
