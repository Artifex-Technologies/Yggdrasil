# Tests and audits every crate on each push and pull request.
name: checks
on:
  push:
  pull_request:
# the token can read the repository and nothing else
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        # pixman: the compositor's software renderer (its headless tests run a compositor in the container)
        run: pacman -Syu --noconfirm --needed git rust base-devel pkgconf wayland libxkbcommon fontconfig pam dbus libxcrypt libinput mesa libvlc pixman
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Test and audit every crate
        run: |
          cargo install cargo-audit --locked
          # every crate is tested and audited; the job fails at the end, naming each one that did not pass
          failed=""
          for d in packages/*/; do
            [ -f "$d/Cargo.toml" ] || continue
            (cd "$d" && cargo test --quiet) || failed="$failed $d(tests)"
            # RUSTSEC-2026-0196/0197: cgmath (unmaintained; Matrix::swap_columns unsound for identical indices) comes with smithay
            # 0.7, the newest, in the compositor; nothing here calls swap_columns. Revisit when smithay drops cgmath.
            (cd "$d" && ~/.cargo/bin/cargo-audit audit -D warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372 --ignore RUSTSEC-2026-0196 --ignore RUSTSEC-2026-0197) || failed="$failed $d(audit)"
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }
  # The panel in a headless sway, building new pictures over and over (pop-ups, toasts, the screen changing size): the buffers it
  # leaves with the compositor must not pile up. Fails on a buffer that is dropped without being destroyed (the 4 GB of 2026-11-09).
  panel-leaks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust base-devel pkgconf wayland libxkbcommon fontconfig dbus sway ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Build the panel
        run: cd packages/panel && cargo build --locked
      - name: Stress test (headless sway, its own session bus)
        run: |
          # sway does not run as root
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && packages/panel/tests/leak-stress.sh target/debug/yggdrasil-panel"
  # The same stress test on Yggdrasil's own compositor in its headless mode (software renderer, no GPU, sizes changed through its
  # control socket): the first of our own pieces tested on our own compositor. The sway job stays until this one has proven itself.
  panel-leaks-own-compositor:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust base-devel pkgconf wayland libxkbcommon fontconfig dbus ttf-dejavu pixman mesa libinput
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Build the panel and the compositor
        run: |
          (cd packages/panel && cargo build --locked)
          (cd packages/compositor && cargo build --locked)
      - name: Stress test (headless yggdrasil-compositor, its own session bus)
        run: |
          # a normal account, as for sway (the compositor itself would run as root, but nothing here needs that)
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && packages/panel/tests/leak-stress.sh --compositor yggdrasil target/debug/yggdrasil-panel"
  # gpuunlock is a live root helper still in Python (Settings runs it through pkexec); its tests fake every outside program,
  # /sys, /proc and /etc, so they run without a graphics card.
  gpuunlock:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Tests
        run: python3 -m unittest discover -s packages/settings/helpers/tests -p 'test_gpuunlock.py' -v
  recipes:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git base-devel lua
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Session config parses, keep-clear checks
        run: |
          for f in packages/session/hyprland/*.lua; do luac -p "$f" || exit 1; done
          lua packages/session/tests/keep-clear.lua
      - name: Package recipes parse
        run: |
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && for d in packages/pkgbuilds/*/; do (cd \$d && makepkg --printsrcinfo >/dev/null) || exit 1; done"
