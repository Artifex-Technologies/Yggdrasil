# Tests and audits every crate on each push and pull request.
name: checks
on:
  push:
  pull_request:
# the token can read the repository and nothing else
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        # pixman: the compositor's software renderer (its headless tests run a compositor in the container)
        run: pacman -Syu --noconfirm --needed git rust base-devel pkgconf wayland libxkbcommon fontconfig pam dbus libxcrypt libinput mesa libvlc pixman
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Format, lint, test and audit every crate
        run: |
          cargo install cargo-audit --locked
          # every crate is checked, tested and audited; the job fails at the end, naming each one that did not pass
          failed=""
          for d in packages/*/; do
            [ -f "$d/Cargo.toml" ] || continue
            # formatting (rustfmt.toml at the top) and lints: the debt cleared on 2026-11-11 must not come back
            (cd "$d" && cargo fmt --check) || failed="$failed $d(fmt)"
            (cd "$d" && cargo clippy --quiet --all-targets -- -D warnings) || failed="$failed $d(clippy)"
            (cd "$d" && cargo test --quiet) || failed="$failed $d(tests)"
            # RUSTSEC-2026-0196/0197: cgmath (unmaintained; Matrix::swap_columns unsound for identical indices) comes with smithay
            # 0.7, the newest, in the compositor; nothing here calls swap_columns. Revisit when smithay drops cgmath.
            (cd "$d" && ~/.cargo/bin/cargo-audit audit -D warnings --ignore RUSTSEC-2024-0436 --ignore RUSTSEC-2026-0192 --ignore RUSTSEC-2026-0370 --ignore RUSTSEC-2026-0371 --ignore RUSTSEC-2026-0372 --ignore RUSTSEC-2026-0196 --ignore RUSTSEC-2026-0197) || failed="$failed $d(audit)"
          done
          [ -z "$failed" ] || { echo "failed:$failed"; exit 1; }
  # The panel in a headless sway, building new pictures over and over (pop-ups, toasts, the screen changing size): the buffers it
  # leaves with the compositor must not pile up. Fails on a buffer that is dropped without being destroyed (the 4 GB of 2026-11-09).
  panel-leaks:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust base-devel pkgconf wayland libxkbcommon fontconfig dbus sway ttf-dejavu
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Build the panel
        run: cd packages/panel && cargo build --locked
      - name: Stress test (headless sway, its own session bus)
        run: |
          # sway does not run as root
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && packages/panel/tests/leak-stress.sh target/debug/yggdrasil-panel"
  # The same stress test on Yggdrasil's own compositor in its headless mode (software renderer, no GPU, sizes changed through its
  # control socket): the first of our own pieces tested on our own compositor. The sway job stays until this one has proven itself.
  panel-leaks-own-compositor:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git rust base-devel pkgconf wayland libxkbcommon fontconfig dbus ttf-dejavu pixman mesa libinput
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Build the panel and the compositor
        run: |
          (cd packages/panel && cargo build --locked)
          (cd packages/compositor && cargo build --locked)
      - name: Stress test (headless yggdrasil-compositor, its own session bus)
        run: |
          # a normal account, as for sway (the compositor itself would run as root, but nothing here needs that)
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && packages/panel/tests/leak-stress.sh --compositor yggdrasil target/debug/yggdrasil-panel"
  # Yggdrasil's own programs on its own compositor, headless (packages/compositor/tests/apps.rs): the panel (bar, dock, wallpaper,
  # a notification, the start menu taking the keyboard), Settings drawn in software, the lock screen (its test-auth build only,
  # never PAM) covering two outputs; and the protocol tests (tests/behaviour.rs) with grim required. No GPU, no input device: the
  # compositor draws in memory and makes keys and clicks itself. Each test has its own time limit; the step has one too.
  compositor-headless:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        # mesa and libglvnd: Settings draws through EGL in software (llvmpipe); grim: the screenshot tool, through wlr-screencopy
        run: pacman -Syu --noconfirm --needed git rust base-devel pkgconf wayland libxkbcommon fontconfig ttf-dejavu dbus pixman mesa libglvnd libinput pam libxcrypt grim
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Build the programs and the tests
        run: |
          (cd packages/panel && cargo build --locked)
          (cd packages/settings && cargo build --locked)
          # the session's window keys and log-out (yggdrasil-snap, -close, -logout), on the compositor through yggdrasil-wm
          (cd packages/wm && cargo build --locked)
          # the lock screen's test build goes to a folder of its own, never mixed up with the real one
          (cd packages/lock && cargo build --locked --features test-auth --target-dir "$GITHUB_WORKSPACE/target/test-auth" --bin yggdrasil-lock)
          # Yggdrasil's cursor theme as yggdrasil-theme draws it, for the pointer test
          (cd packages/theme && cargo build --locked --bin ygg-cursors)
          target/debug/ygg-cursors target/test-cursors/Yggdrasil
          (cd packages/compositor && cargo test --locked --no-run --test apps --test behaviour --test tools --test keys --test look --test outputs --test places --test capture --test pointer --test input)
      - name: Headless tests with Yggdrasil's programs
        timeout-minutes: 15
        run: |
          cd packages/compositor
          YGGDRASIL_TEST_PANEL="$GITHUB_WORKSPACE/target/debug/yggdrasil-panel" \
          YGGDRASIL_TEST_SETTINGS="$GITHUB_WORKSPACE/target/debug/yggdrasil-settings" \
          YGGDRASIL_TEST_LOCK="$GITHUB_WORKSPACE/target/test-auth/debug/yggdrasil-lock" \
          YGGDRASIL_TEST_SNAP="$GITHUB_WORKSPACE/target/debug/yggdrasil-snap" \
          YGGDRASIL_TEST_CLOSE="$GITHUB_WORKSPACE/target/debug/yggdrasil-close" \
          YGGDRASIL_TEST_LOGOUT="$GITHUB_WORKSPACE/target/debug/yggdrasil-logout" \
          YGGDRASIL_TEST_CURSORS="$GITHUB_WORKSPACE/target/test-cursors" \
          YGGDRASIL_TEST_APPS_REQUIRED=1 \
            cargo test --locked --test apps --test behaviour --test tools --test keys --test look --test outputs --test places --test capture --test pointer --test input -- --test-threads=2
  # gpuunlock is a live root helper still in Python (Settings runs it through pkexec); its tests fake every outside program,
  # /sys, /proc and /etc, so they run without a graphics card.
  gpuunlock:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git python
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Tests
        run: python3 -m unittest discover -s packages/settings/helpers/tests -p 'test_gpuunlock.py' -v
  recipes:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Tools
        run: pacman -Syu --noconfirm --needed git base-devel lua
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, pinned by commit
        with:
          persist-credentials: false
      - name: Session config parses, keep-clear and input.conf checks
        run: |
          for f in packages/session/hyprland/*.lua; do luac -p "$f" || exit 1; done
          lua packages/session/tests/keep-clear.lua
          lua packages/session/tests/input-conf.lua
      - name: Package recipes parse
        run: |
          useradd -m ci && chown -R ci "$GITHUB_WORKSPACE"
          su ci -c "cd '$GITHUB_WORKSPACE' && for d in packages/pkgbuilds/*/; do (cd \$d && makepkg --printsrcinfo >/dev/null) || exit 1; done"
