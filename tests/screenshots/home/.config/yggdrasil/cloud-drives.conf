# Cloud drives: written by Settings > Apps > Minos > Cloud drives; Minos lists them under Cloud Storage.
# [remote NAME] is an rclone remote mounted at `mount`; [folder NAME] is a folder a sync app keeps.

[remote GoogleDrive]
type = drive
mount = /home/alex/Cloud/GoogleDrive

[remote OneDrive]
type = onedrive
mount = /home/alex/Cloud/OneDrive

[folder Nextcloud]
path = /home/alex/Nextcloud
