# The Agents bar item from this repository's own build, for the screenshots only (scripts/screenshots.sh lays this folder over
# the system's integrations inside its sandbox). It shows nothing until the "agents" picture writes its made-up agents.
kind = bar-item
name = Agents
command = /run/ygg/src/target/debug/yggdrasil-agent-usage --agents
interval = 600
watch = %h/.claude/sessions
act = /run/ygg/src/target/debug/yggdrasil-agent-usage --act
